<title>Waypoint Style Samples</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a neutral picker bar over three self-contained one-screen samples. Each sample owns its own tokens (a deliberate single look per sample). */
:root {
  --bg: #0d0f12; --fg: #e6e9ee; --muted: #8b93a1; --line: #262b33; --pick: #4cc3e8;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: "Geist", system-ui, sans-serif; margin: 0;
  padding-block: 16px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 16px; }
.picker { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; justify-content: space-between; }
.picker h1 { font-size: 14px; font-weight: 500; margin: 0; color: var(--muted); letter-spacing: .02em; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tabs button { font: inherit; font-size: 13px; color: var(--fg); background: transparent; border: 1px solid var(--line); padding: 8px 16px; cursor: pointer; border-radius: 2px; }
.tabs button[aria-pressed="true"] { border-color: var(--pick); color: var(--pick); }
.tabs button:focus-visible { outline: 2px solid var(--pick); outline-offset: 2px; }
.note { font-size: 12px; color: var(--muted); margin: 0; }
.sample { display: none; }
.sample.on { display: block; }

/* ---------- shared sample structure ---------- */
.s { --r: 2px; border: 1px solid var(--s-line); background: var(--s-bg); color: var(--s-fg); font-family: var(--s-ui); border-radius: var(--r); overflow: hidden; }
.s * { min-width: 0; }
.s .mono { font-family: var(--s-mono); font-variant-numeric: tabular-nums; }
.s header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--s-line); }
.s .brand { font-weight: 600; letter-spacing: .01em; display: flex; align-items: center; gap: 8px; }
.s .mark { width: 8px; height: 8px; background: var(--s-accent); display: inline-block; }
.s .chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12px; }
.chip { border: 1px solid var(--s-line); padding: 4px 8px; border-radius: var(--r); color: var(--s-muted); white-space: nowrap; }
.chip b { color: var(--s-fg); font-weight: 500; }
.chip.net::before { content: ""; display: inline-block; width: 6px; height: 6px; background: var(--s-accent); margin-right: 8px; vertical-align: 1px; }
.body { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); }
@media (max-width: 760px) { .body { grid-template-columns: minmax(0, 1fr); } }
.trail { padding: 24px; display: grid; gap: 0; align-content: start; }
.readout { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; justify-content: space-between; padding-bottom: 16px; border-bottom: 1px solid var(--s-line); margin-bottom: 8px; }
.readout .big { font-size: 32px; font-weight: 500; line-height: 1; }
.readout .lbl, .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--s-muted); }
.bar { display: flex; gap: 4px; flex: 1 1 160px; max-width: 280px; }
.bar i { flex: 1; height: 4px; background: var(--s-line); }
.bar i.v { background: var(--s-ok); }
.m { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 0 16px; padding: 16px 0; border-bottom: 1px solid var(--s-line); align-items: start; }
.m:last-child { border-bottom: 0; }
.m .n { font-family: var(--s-mono); font-size: 12px; color: var(--s-muted); padding-top: 2px; }
.m h3 { margin: 0; font-size: 15px; font-weight: 500; }
.m p { margin: 4px 0 0; font-size: 13px; color: var(--s-muted); line-height: 1.45; }
.m .meta { font-family: var(--s-mono); font-size: 11px; color: var(--s-muted); margin-top: 8px; overflow-wrap: anywhere; }
.st { font-family: var(--s-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 4px 8px; border: 1px solid var(--s-line); border-radius: var(--r); color: var(--s-muted); white-space: nowrap; }
.st.verified { color: var(--s-ok); border-color: var(--s-ok); }
.st.ready { color: var(--s-accent); border-color: var(--s-accent); }
.m.locked h3 { color: var(--s-muted); }
.open { grid-column: 2 / -1; margin-top: 16px; display: grid; gap: 16px; }
.steps { margin: 0; padding-left: 16px; font-size: 13px; line-height: 1.6; color: var(--s-fg); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { font: inherit; font-size: 13px; font-weight: 500; padding: 8px 16px; border-radius: var(--r); cursor: pointer; border: 1px solid var(--s-line); background: transparent; color: var(--s-fg); }
.btn.pri { background: var(--s-accent); color: var(--s-onaccent); border-color: var(--s-accent); }
.btn:focus-visible { outline: 2px solid var(--s-accent); outline-offset: 2px; }
.rcpt-wrap { padding: 24px; border-left: 1px solid var(--s-line); display: grid; gap: 16px; align-content: start; }
@media (max-width: 760px) { .rcpt-wrap { border-left: 0; border-top: 1px solid var(--s-line); } }
.rcpt { border: 1px solid var(--s-line); background: var(--s-card); padding: 16px; display: grid; gap: 16px; border-radius: var(--r); }
.rcpt .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.rcpt dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 16px; font-size: 12px; }
.rcpt dt { color: var(--s-muted); }
.rcpt dd { margin: 0; font-family: var(--s-mono); overflow-wrap: anywhere; }
.rcpt .ok { color: var(--s-ok); }
.rcpt a { color: var(--s-accent); font-size: 12px; text-decoration: none; border-bottom: 1px solid currentColor; width: fit-content; }
.foot { padding: 8px 24px; border-top: 1px solid var(--s-line); font-size: 11px; color: var(--s-muted); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }

/* ---------- 1 Instrument: graphite, one cool accent ---------- */
.instrument { --s-bg: #121418; --s-card: #171a1f; --s-fg: #e8ebf0; --s-muted: #8a92a0; --s-line: #272c34; --s-accent: #4cc3e8; --s-onaccent: #06161c; --s-ok: #3fd18a; --s-ui: "Geist", system-ui, sans-serif; --s-mono: "Geist Mono", ui-monospace, monospace; }
.instrument .m.ready { background: linear-gradient(90deg, rgba(76,195,232,.06), transparent 60%); margin-inline: -24px; padding-inline: 24px; }

/* ---------- 2 Blueprint: light technical drawing (cool paper, ink blue) ---------- */
.blueprint { --s-bg: #eef2f7; --s-card: #f7f9fc; --s-fg: #14233a; --s-muted: #5b6b82; --s-line: #b9c6d8; --s-accent: #1553b6; --s-onaccent: #ffffff; --s-ok: #0f8a54; --s-ui: "Inter Tight", system-ui, sans-serif; --s-mono: "JetBrains Mono", ui-monospace, monospace;
  background-image: linear-gradient(#dbe4ef 1px, transparent 1px), linear-gradient(90deg, #dbe4ef 1px, transparent 1px); background-size: 24px 24px; background-color: var(--s-bg); }
.blueprint header, .blueprint .foot { background: var(--s-bg); }
.blueprint .trail, .blueprint .rcpt-wrap { background: transparent; }
.blueprint .rcpt { background: var(--s-card); border-color: var(--s-fg); }
.blueprint .st { border-style: dashed; }
.blueprint .st.verified, .blueprint .st.ready { border-style: solid; }
.blueprint .mark { background: transparent; border: 2px solid var(--s-accent); }

/* ---------- 3 Signal: near-black, a single neon line ---------- */
.signal { --s-bg: #050607; --s-card: #0a0c0e; --s-fg: #dfe6ea; --s-muted: #6f7a82; --s-line: #1a2024; --s-accent: #00e0ff; --s-onaccent: #00161a; --s-ok: #46e08f; --s-ui: "Inter Tight", system-ui, sans-serif; --s-mono: "JetBrains Mono", ui-monospace, monospace; }
.signal .m.ready { box-shadow: inset 2px 0 0 var(--s-accent); margin-inline: -24px; padding-inline: 22px 24px; }
.signal .brand .mark { box-shadow: 0 0 12px var(--s-accent); }
.signal .bar i.v { box-shadow: 0 0 8px rgba(70,224,143,.5); }
.signal .st.ready { box-shadow: 0 0 10px rgba(0,224,255,.25); }

@media (prefers-reduced-motion: no-preference) { .s .btn, .tabs button { transition: border-color .15s, color .15s; } }
</style>

<div class="wrap">
  <div class="picker">
    <h1>Waypoint · pick a direction</h1>
    <div class="tabs" role="group" aria-label="Style sample">
      <button id="t-instrument" aria-pressed="true" data-k="instrument">Instrument</button>
      <button id="t-blueprint" aria-pressed="false" data-k="blueprint">Blueprint</button>
      <button id="t-signal" aria-pressed="false" data-k="signal">Signal</button>
    </div>
  </div>
  <p class="note">Same screen, three treatments. Values shown are sample data, not a live wallet. Green appears only on verified items.</p>
  <div id="host"></div>
</div>

<script>
var M = [
  { n: 1, t: "Create your wallet", g: "Create a passkey wallet with the official embedded wallet.", s: "verified", meta: "taknSJFe…xcjuUa  ·  owner: Passkey Manager" },
  { n: 2, t: "Get test funds", g: "Receive native THRU from the faucet.", s: "verified", meta: "balance 600  ·  slot 3,107,100" },
  { n: 3, t: "Send your first transfer", g: "Send a small native transfer to the target address.", s: "ready", open: true },
  { n: 4, t: "Open a token account", g: "Create a THRUSD token account owned by your wallet.", s: "locked" },
  { n: 5, t: "Move a token", g: "Send a small amount of THRUSD to another account.", s: "locked" }
];
var LABEL = { verified: "Verified", ready: "Ready", locked: "Locked" };
function mission(m) {
  var h = '<div class="m ' + m.s + '"><span class="n">0' + m.n + '</span><div><h3>' + m.t + '</h3><p>' + m.g + '</p>' + (m.meta ? '<div class="meta">' + m.meta + '</div>' : '') + '</div><span class="st ' + m.s + '">' + LABEL[m.s] + '</span>';
  if (m.open) h += '<div class="open"><ol class="steps"><li>Open the wallet and review the transfer.</li><li>Approve with your passkey.</li><li>Press Verify. Waypoint reads the chain for your transaction.</li></ol><div class="actions"><button class="btn pri" type="button">Send transfer</button><button class="btn" type="button">Verify</button></div></div>';
  return h + '</div>';
}
function sample(k, name) {
  var bars = M.map(function (m) { return '<i class="' + (m.s === "verified" ? "v" : "") + '"></i>'; }).join("");
  return '<section class="s ' + k + ' sample" id="s-' + k + '" aria-label="' + name + ' sample">' +
    '<header><div class="brand"><span class="mark"></span>Waypoint</div><div class="chips"><span class="chip net"><b>Alphanet</b></span><span class="chip mono">taknSJFe…xcjuUa</span><span class="chip">Unofficial community project</span></div></header>' +
    '<div class="body"><div class="trail"><div class="readout"><div><div class="lbl">Verified on-chain</div><div class="big mono">2 / 5</div></div><div class="bar" aria-hidden="true">' + bars + '</div></div>' + M.map(mission).join("") + '</div>' +
    '<div class="rcpt-wrap"><div class="lbl">Receipt · Mission 02</div><div class="rcpt"><div class="top"><strong>Get test funds</strong><span class="st verified">Verified</span></div>' +
    '<dl><dt>Address</dt><dd>taknSJFe…xcjuUa</dd><dt>Signature</dt><dd>tsHeXDfU…IASIS</dd><dt>Slot</dt><dd>3,107,100</dd><dt>Time</dt><dd>2026-10-27 17:52 UTC</dd><dt>Network</dt><dd>Alphanet</dd></dl>' +
    '<a href="#" onclick="return false">Open in explorer</a></div><div class="actions"><button class="btn" type="button">Copy link</button><button class="btn" type="button">Download image</button></div></div></div>' +
    '<div class="foot"><span>Progress is recomputed from chain data on every visit.</span><span class="mono">height 3,107,342</span></div></section>';
}
var host = document.getElementById("host");
host.innerHTML = sample("instrument", "Instrument") + sample("blueprint", "Blueprint") + sample("signal", "Signal");
function show(k) {
  ["instrument", "blueprint", "signal"].forEach(function (x) {
    document.getElementById("s-" + x).classList.toggle("on", x === k);
    document.getElementById("t-" + x).setAttribute("aria-pressed", x === k ? "true" : "false");
  });
  try { history.replaceState(null, "", "#" + k); } catch (e) {}
}
Array.prototype.forEach.call(document.querySelectorAll(".tabs button"), function (b) { b.addEventListener("click", function () { show(b.dataset.k); }); });
var h = (location.hash || "").slice(1);
show(["instrument", "blueprint", "signal"].indexOf(h) > -1 ? h : "instrument");
window.addEventListener("hashchange", function () { var x = location.hash.slice(1); if (["instrument", "blueprint", "signal"].indexOf(x) > -1) show(x); });
</script>
